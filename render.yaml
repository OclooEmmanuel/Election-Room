services:
  - type: web
    name: election-room
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn prefect_voting.wsgi:application --workers 2 --timeout 120 --access-logfile -"
    preDeployCommand: "python manage.py migrate && python manage.py init_admin"
    healthCheckPath: /results/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_DB
        value: postgres
      # Storage: candidate photos are REQUIRED and are uploaded through the
      # admin. Render's free tier uses an ephemeral disk, so use S3 for media:
      # set DJANGO_STORAGE to "s3" and add AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_STORAGE_BUCKET_NAME, AWS_S3_ENDPOINT_URL and
      # AWS_S3_CUSTOM_DOMAIN in the Render dashboard (kept out of this file).
      - key: DJANGO_STORAGE
        value: local
      - key: ALLOWED_HOSTS
        value: election-room.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Optional: auto-create an admin account on first deploy
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: election-room-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: election-room-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: election-room-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: election-room-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: election-room-db
          property: port

databases:
  - name: election-room-db
    plan: free