services:
  - type: web
    name: election-room
    runtime: python
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn prefect_voting.wsgi:application --workers 1 --timeout 120 --access-logfile -"
    preDeployCommand: "python manage.py migrate && python manage.py init_admin"
    healthCheckPath: /results/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_DB
        value: postgres
      # Free tier has an ephemeral disk, and code is on Supabase Storage (S3).
      # S3 also survives redeploys. Set DJANGO_STORAGE=s3 and add the AWS_*
      # values below in the Render dashboard (kept out of this repo file).
      - key: DJANGO_STORAGE
        sync: false
      - key: ALLOWED_HOSTS
        value: election-room.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # --- Admin account (created on first deploy by init_admin) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # --- Supabase Postgres (set values from the Supabase dashboard) ---
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false

      # --- Supabase Storage (S3-compatible; set when DJANGO_STORAGE=s3) ---
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false